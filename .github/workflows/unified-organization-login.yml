name: Unified organization login
"on":
  pull_request:
    paths:
      - src/pages/Login.tsx
      - src/api/tenant*
      - src/types/tenant.ts
      - src/utils/publishedTenantIdentity*
      - src/components/layout/Navbar*
      - src/components/auth/InstitutionalLoginLogo*
      - src/components/brand/InstitutionalAccessBrand*
      - src/api/panelLogin*
      - src/utils/panelLogin*
      - src/utils/completePanelCredentialLogin*
      - src/hooks/useUser*
      - src/components/auth/panelLogin.css
      - tests/useUserStability.test.tsx
      - tests/unified_login_http.py
      - tests/unified-login.browser.mjs
      - tests/e2e/fixtures/unified-login.*
      - .github/workflows/unified-organization-login.yml
permissions:
  contents: read
concurrency:
  group: unified-login-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Complete frontend regression
        run: |
          mkdir -p .vercel/unified-login-evidence
          npm test -- --maxWorkers=2 --reporter=json --outputFile=.vercel/unified-login-evidence/vitest.json
      - name: Application build
        run: npm run build
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unified-login-evidence
          path: .vercel/unified-login-evidence/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
