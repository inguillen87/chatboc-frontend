name: Guided setup regression
"on":
  pull_request:
    paths:
      - src/components/implementation/**
      - src/pages/TenantImplementationCenterPage*
      - .github/workflows/setup-guide.yml
permissions:
  contents: read
concurrency:
  group: guided-setup-${{ github.ref }}
  cancel-in-progress: true
jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck && npm run typecheck:scope
      - run: npm test -- src/components/implementation/SetupPreparationGuide.test.tsx src/components/implementation/TenantBlueprintProvisioningPanel.stepUp.test.tsx src/components/implementation/TenantLaunchJourney.test.tsx src/pages/TenantImplementationCenterPage.test.tsx --maxWorkers=2
      - run: npm run build
