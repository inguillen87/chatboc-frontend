      <path d="M542 419c20-7 47 3 56 23 9 21-5 46-29 49-19 2-39-12-44-31-5-17 2-34 17-41Z" fill="url(#white-part)"/>
      <path d="M574 429c28-5 49 4 56 22" fill="none" stroke="#eaf6ff" stroke-width="18" stroke-linecap="round"/>
      <path d="M598 451l44 13" stroke="#eaf6ff" stroke-width="17" stroke-linecap="round"/>
      <path d="M589 477l39 21" stroke="#eaf6ff" stroke-width="16" stroke-linecap="round"/>
