name: Section recovery and preserved workspace
"on":
  pull_request:
    paths:
      - src/components/errors/SectionErrorBoundary*
      - src/components/errors/sectionRecovery.css
      - src/pages/TicketsPanel.tsx
      - src/pages/EstadisticasPage.tsx
      - src/pages/admin/CatalogMappingPage.tsx
      - src/pages/admin/CategoryManagementPage.tsx
      - src/pages/admin/encuestas/index.tsx
      - src/pages/analytics/AnalyticsPage.tsx
      - tests/section-recovery.browser.mjs
      - tests/e2e/fixtures/section-recovery.*
      - .github/workflows/section-recovery.yml
permissions:
  contents: read
concurrency:
  group: section-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Complete application regression
        run: |
          mkdir -p .vercel/section-recovery-evidence
          npm test -- --maxWorkers=2 --reporter=json --outputFile=.vercel/section-recovery-evidence/vitest.json
      - name: Production build
        run: npm run build
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Real page recovery with synthetic faults
        run: node tests/section-recovery.browser.mjs
      - name: Recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: section-recovery-evidence
          path: .vercel/section-recovery-evidence/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
