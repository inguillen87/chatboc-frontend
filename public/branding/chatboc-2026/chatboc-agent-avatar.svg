      <circle cx="544" cy="514" r="27" fill="#ecfff5"/>
      <circle cx="544" cy="514" r="14" fill="#10b981"/>
      <path d="M505 473c11-13 26-20 45-20" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity=".56"/>
