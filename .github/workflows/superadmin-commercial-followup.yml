name: SuperAdmin commercial follow-up
"on":
  pull_request:
    paths:
      - src/components/admin/platform/**
      - tests/commercial-followup.browser.mjs
      - tests/e2e/fixtures/commercial-followup.*
      - .github/workflows/superadmin-commercial-followup.yml
permissions:
  contents: read
concurrency:
  group: superadmin-commercial-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Full application regression
        run: npm test -- --maxWorkers=2
      - name: Production build
        run: npm run build
