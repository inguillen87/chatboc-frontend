name: CRM persistent follow-up
"on":
  pull_request:
    paths:
      - src/features/crm/followup/**
      - src/features/crm/people/CrmPeopleWorkspace*
      - src/pages/admin/SuperAdminDashboard.tsx
      - src/components/admin/platform/SuperAdminDashboard.test.tsx
      - tests/followup-workspace.browser.mjs
      - tests/followup-full.browser.mjs
      - tests/followup-backend-http.py
      - tests/e2e/fixtures/followup-workspace.*
      - .github/workflows/crm-followup-workspace.yml
permissions:
  contents: read
concurrency:
  group: crm-followup-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Full application regression
        run: |
          mkdir -p .vercel/followup-evidence
          npm test -- --maxWorkers=2 --reporter=json --outputFile=.vercel/followup-evidence/vitest.json
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Follow-up UI and verification protocol
        run: node tests/followup-workspace.browser.mjs
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crm-followup-evidence
          path: .vercel/followup-evidence/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
