name: WhatsApp guided setup
"on":
  pull_request:
    paths:
      - src/components/integrations/WhatsappTechProviderOnboarding*
      - src/components/integrations/whatsappSetupEvidence*
      - src/components/integrations/WhatsappOrganizationContext*
      - tests/whatsapp-onboarding/**
      - .github/workflows/whatsapp-onboarding.yml
permissions:
  contents: read
concurrency:
  group: whatsapp-guided-setup-${{ github.ref }}
  cancel-in-progress: true
jobs:
  interface:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck && npm run typecheck:scope
      - run: npm test -- --maxWorkers=2
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Test real component with synthetic API on phone, tablet and desktop sizes
        run: node tests/whatsapp-onboarding/browser.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: whatsapp-setup-evidence
          path: .vercel/evidence/whatsapp-setup
          retention-days: 7
