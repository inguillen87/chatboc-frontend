      <stop offset=".22" stop-color="#38bdf8" stop-opacity=".54"/>
      <stop offset=".68" stop-color="#0b1b5f" stop-opacity=".05"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cap-blue" x1="217" x2="508" y1="93" y2="163" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#47d8ff"/>
      <stop offset=".42" stop-color="#0d63ff"/>
      <stop offset="1" stop-color="#0831b2"/>
    </linearGradient>
    <radialGradient id="body" cx="34%" cy="16%" r="92%">
      <stop offset="0" stop-color="#57d7ff"/>
      <stop offset=".28" stop-color="#1479ff"/>
      <stop offset=".68" stop-color="#083fc7"/>
      <stop offset="1" stop-color="#05206f"/>
    </radialGradient>
    <linearGradient id="body-side" x1="218" x2="505" y1="397" y2="688" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dd4ff" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#1d4ed8" stop-opacity=".1"/>
      <stop offset="1" stop-color="#020617" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="limb-blue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#38d6ff"/>
      <stop offset=".42" stop-color="#0b65ff"/>
      <stop offset="1" stop-color="#06267d"/>
    </linearGradient>
    <linearGradient id="white-part" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".52" stop-color="#e6f4ff"/>
      <stop offset="1" stop-color="#9fbce8"/>
    </linearGradient>
    <linearGradient id="pin" x1="500" x2="608" y1="440" y2="573" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#66f6a3"/>
      <stop offset=".5" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#0f8d45"/>
    </linearGradient>
    <linearGradient id="bubble" x1="492" x2="644" y1="109" y2="187" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe66f"/>
      <stop offset=".58" stop-color="#ffbf1f"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="soft-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#020617" flood-opacity=".45"/>
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#38bdf8" flood-opacity=".26"/>
    </filter>
    <filter id="hard-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#7dd3fc" flood-opacity=".64"/>
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity=".28"/>
    </filter>
    <clipPath id="visor-clip">
      <path d="M195 253c15-45 66-72 165-72 101 0 153 27 166 72 10 36-7 75-41 92-38 19-212 19-250 0-34-17-51-56-40-92Z"/>
    </clipPath>
  </defs>

  <ellipse cx="360" cy="742" rx="184" ry="42" fill="#020617" opacity=".34"/>
  <circle cx="358" cy="356" r="324" fill="url(#halo)" opacity=".78"/>
  <path id="spark-a" d="M159 155h42M180 134v42" stroke="#fde047" stroke-width="14" stroke-linecap="round" opacity=".9"/>
  <path id="spark-b" d="M607 267l32-22M614 304l38 8" stroke="#67e8f9" stroke-width="12" stroke-linecap="round" opacity=".82"/>
  <path id="spark-c" d="M112 508l31 21M138 486l-18 34" stroke="#22c55e" stroke-width="11" stroke-linecap="round" opacity=".72"/>

