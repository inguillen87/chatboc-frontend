<!DOCTYPE html>
<html lang="es" style="background:transparent">
  <head>
    <script>
      try {
        if (
          localStorage.theme === 'dark' ||
          (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {
        // ignore if storage is not accessible
      }
    </script>

    <link rel="icon" type="image/svg+xml" href="/chatboc_frontend_pack/branding/chatboc/navbar/chatboc-favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/chatboc_frontend_pack/branding/chatboc/navbar/chatboc-favicon_32.png">
    <link rel="apple-touch-icon" sizes="192x192" href="/chatboc_frontend_pack/branding/chatboc/navbar/chatboc-favicon_256.png">
    <link rel="manifest" href="/manifest.portal.webmanifest">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, shrink-to-fit=no" />
    <title>Chatboc Portal</title>
    <meta name="description" content="Portal de usuario Chatboc." />
    <meta name="theme-color" content="#0f62fe">
  </head>
  <body style="background:transparent;margin:0;padding:0;">
    <div id="root"></div>
    <script type="module" src="/src/portalMain.tsx"></script>
  </body>
</html>
