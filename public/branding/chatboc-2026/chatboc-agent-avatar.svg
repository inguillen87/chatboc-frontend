    <path d="M195 253c15-45 66-72 165-72 101 0 153 27 166 72 10 36-7 75-41 92-38 19-212 19-250 0-34-17-51-56-40-92Z" fill="none" stroke="#bdf8ff" stroke-width="7" opacity=".54"/>
    <path d="M219 200c31-43 80-64 141-64 62 0 112 21 143 64" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" opacity=".5"/>

    <g opacity=".95">
