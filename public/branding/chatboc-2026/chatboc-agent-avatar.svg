<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 820" role="img" aria-labelledby="title desc">
  <title id="title">Chatboc premium robot assistant</title>
  <desc id="desc">A glossy blue and white 3D-style robot mascot with a glass visor, headset, chat bubble and location pin.</desc>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      #agent { animation: agent-float 6s ease-in-out infinite; transform-origin: 360px 720px; }
      #right-arm { animation: right-wave 2.9s cubic-bezier(.34,1.56,.64,1) infinite; transform-origin: 494px 370px; }
      #left-arm { animation: left-balance 3.2s ease-in-out infinite; transform-origin: 250px 430px; }
      #left-leg { animation: left-leg-step 1.05s ease-in-out infinite; transform-origin: 306px 604px; }
      #right-leg { animation: right-leg-step 1.05s ease-in-out infinite; transform-origin: 415px 604px; }
      #left-foot { animation: left-foot-step 1.05s ease-in-out infinite; transform-origin: 292px 724px; }
      #right-foot { animation: right-foot-step 1.05s ease-in-out infinite; transform-origin: 428px 724px; }
      #left-pin { animation: pin-float 3.6s ease-in-out infinite; transform-origin: 548px 510px; }
      #chat-bubble { animation: bubble-float 4.1s ease-in-out infinite; transform-origin: 555px 151px; }
      #visor-gloss { animation: visor-sweep 5.8s ease-in-out infinite; }
      #right-eye, #right-pupil, #right-eye-spark-a, #right-eye-spark-b { animation: robot-wink 6.2s ease-in-out infinite; transform-origin: 423px 286px; }
      #left-pupil, #right-pupil { animation: eye-look 4.4s ease-in-out infinite; transform-origin: center; }
      #mouth-smile { animation: mouth-speak 2.15s ease-in-out infinite; transform-origin: 360px 338px; }
      #mouth-highlight { animation: mouth-highlight 2.15s ease-in-out infinite; transform-origin: 360px 335px; }
      #spark-a, #spark-b, #spark-c { animation: spark-pulse 2.8s ease-in-out infinite; transform-origin: center; }
      #spark-b { animation-delay: .5s; }
      #spark-c { animation-delay: .95s; }
      @keyframes agent-float { 0%,100% { transform: translateY(0) rotate(-.45deg); } 50% { transform: translateY(-14px) rotate(.55deg); } }
      @keyframes right-wave { 0%,100% { transform: rotate(0deg); } 12% { transform: rotate(-18deg); } 24% { transform: rotate(11deg); } 36% { transform: rotate(-15deg); } 48% { transform: rotate(7deg); } 66% { transform: rotate(0deg); } }
      @keyframes left-balance { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(4deg); } }
      @keyframes left-leg-step { 0%,100% { transform: translateX(-7px) rotate(5deg); } 50% { transform: translateX(6px) rotate(-4deg); } }
      @keyframes right-leg-step { 0%,100% { transform: translateX(6px) rotate(-5deg); } 50% { transform: translateX(-7px) rotate(4deg); } }
      @keyframes left-foot-step { 0%,100% { transform: translate(-8px,1px) rotate(7deg); } 50% { transform: translate(8px,-6px) rotate(-8deg); } }
      @keyframes right-foot-step { 0%,100% { transform: translate(8px,-6px) rotate(-8deg); } 50% { transform: translate(-8px,1px) rotate(7deg); } }
      @keyframes pin-float { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-9px) rotate(2deg); } }
      @keyframes bubble-float { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-7px) scale(1.025); } }
      @keyframes visor-sweep { 0%,62% { transform: translateX(-320px) skewX(-16deg); opacity: 0; } 72% { opacity: .75; } 92%,100% { transform: translateX(310px) skewX(-16deg); opacity: 0; } }
      @keyframes robot-wink { 0%,72%,100% { transform: scaleY(1); opacity: 1; } 76%,82% { transform: scaleY(.12); opacity: .88; } 86% { transform: scaleY(1); opacity: 1; } }
      @keyframes eye-look { 0%,100% { transform: translateX(0); } 35% { transform: translateX(5px); } 65% { transform: translateX(-4px); } }
      @keyframes mouth-speak { 0%,100% { transform: translateY(0) scaleY(.72); } 22% { transform: translateY(2px) scaleY(1.32); } 48% { transform: translateY(-1px) scaleY(.9); } 72% { transform: translateY(2px) scaleY(1.18); } }
      @keyframes mouth-highlight { 0%,100% { opacity: .75; transform: translateY(0) scaleX(.92); } 35%,72% { opacity: 1; transform: translateY(2px) scaleX(1.08); } }
      @keyframes spark-pulse { 0%,100% { opacity: .34; transform: scale(.82); } 50% { opacity: 1; transform: scale(1.08); } }
    }
  </style>
  <defs>
    <radialGradient id="halo" cx="48%" cy="35%" r="64%">
      <stop offset="0" stop-color="#9ff6ff" stop-opacity=".9"/>
      <stop offset=".27" stop-color="#38bdf8" stop-opacity=".45"/>
      <stop offset=".62" stop-color="#1d4ed8" stop-opacity=".18"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="helmet" cx="38%" cy="25%" r="80%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".32" stop-color="#f7fdff"/>
      <stop offset=".62" stop-color="#d7eaff"/>
      <stop offset="1" stop-color="#8ab1f2"/>
    </radialGradient>
    <linearGradient id="helmet-rim" x1="184" x2="537" y1="112" y2="326" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".42" stop-color="#dff6ff"/>
      <stop offset="1" stop-color="#1451d9"/>
    </linearGradient>
    <linearGradient id="visor" x1="195" x2="523" y1="232" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06164d"/>
      <stop offset=".46" stop-color="#0d3ac8"/>
      <stop offset=".74" stop-color="#071d71"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="visor-light" cx="36%" cy="28%" r="62%">
