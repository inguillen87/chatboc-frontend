<!DOCTYPE html>
<html lang="es" style="background:transparent">
  <head>
    <script>
      try {
        if (
          localStorage.theme === 'dark' ||
          (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {
        // ignore if storage is not accessible
      }
    </script>

    <link rel="icon" type="image/svg+xml" href="/branding/chatboc-2026/chatboc-agent-mark.svg">

    <link rel="apple-touch-icon" sizes="192x192" href="/chatboc_frontend_pack/branding/chatboc/navbar/chatboc-favicon_256.png">
    <script src="/asset-recovery.js"></script>

    <meta charset="UTF-8" />
    <meta name="chatboc-build-revision" content="%VITE_APP_VERSION%" />
