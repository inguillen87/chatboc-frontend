name: Operations workspace and scoped reads
"on":
  pull_request:
    paths:
      - src/features/analytics/**
      - tests/operations-workspace.browser.mjs
      - tests/e2e/fixtures/operations-workspace*
      - .github/workflows/operations-workspace.yml
permissions:
  contents: read
concurrency:
  group: operations-workspace-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Full application regression
        shell: bash
        run: |
          mkdir -p .vercel/operations-live-evidence
          set -o pipefail
          npm test -- --maxWorkers=2 --reporter=json --outputFile=.vercel/operations-live-evidence/vitest.json 2>&1 | tee .vercel/operations-live-evidence/vitest.log
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Responsive sources, navigation and batched reads
        run: node tests/operations-workspace.browser.mjs
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: operations-live-evidence
          path: .vercel/operations-live-evidence/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
