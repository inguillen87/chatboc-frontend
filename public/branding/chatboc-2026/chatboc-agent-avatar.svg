      <path id="mouth-smile" d="M330 337c18 19 42 19 60 0" fill="none" stroke="#ff7aa2" stroke-width="12" stroke-linecap="round"/>
      <path id="mouth-highlight" d="M332 333c17 14 39 14 56 0" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".9"/>
