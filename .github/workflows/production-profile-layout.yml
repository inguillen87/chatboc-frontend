name: Production UI continuity
"on":
  pull_request:
    paths:
      - src/components/app-shell/AppShellStatusBar*
      - src/components/app-shell/RuntimeRecoveryBar*
      - src/components/layout/Navbar.tsx
      - src/config/runtimeRecovery*
      - src/services/runtimeRecoveryConfig*
      - tests/fixtures/runtime-recovery-ui.json
      - src/hooks/useRuntimeRecovery*
      - src/hooks/useFixedHeaderOffset*
      - src/utils/backendBootstrapGate*
      - src/utils/backendReadinessLease*
      - src/utils/runtimeRecoveryPolicy*
      - tests/runtime-resume.browser.mjs
      - tests/e2e/fixtures/runtime-resume.*
      - src/components/profile/InstitutionProfileWorkspace.tsx
      - tests/production-profile.browser.mjs
      - tests/e2e/fixtures/production-profile.*
      - .github/workflows/production-profile-layout.yml
permissions:
  contents: read
concurrency:
  group: production-profile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck && npm test -- --maxWorkers=2 && npm run build
      - run: npx playwright install --with-deps chromium
      - run: node tests/production-profile.browser.mjs && node tests/runtime-resume.browser.mjs
