name: Runtime readiness lease
"on":
  pull_request:
    paths:
      - src/utils/backendBootstrapGate*
      - src/utils/backendReadinessLease*
      - src/config/publicPresentationRoutes.ts
      - .github/workflows/runtime-readiness.yml
permissions:
  contents: read
concurrency:
  group: runtime-readiness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck && npm run typecheck:scope
      - run: npm test -- src/utils/backendBootstrapGate.test.ts src/utils/backendBootstrapGate.release.test.ts src/utils/backendReadinessLease.test.ts --maxWorkers=2
      - run: npm run build
