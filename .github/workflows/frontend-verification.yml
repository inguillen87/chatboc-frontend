# One PR merge build and regression; every acceptance runs for every PR.
name: Frontend verification
'on':
  pull_request: null
permissions:
  contents: read
concurrency:
  group: frontend-verification-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  CI_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  verify_once:
    name: verify_once
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
      artifact_digest: ${{ steps.bundle.outputs.artifact-digest }}
      manifest_sha256: ${{ steps.package.outputs.manifest_sha256 }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
        cache: npm
    - run: npm ci --ignore-scripts --no-audit --no-fund
    - name: CI artifact contract negatives
      run: python3 -B -m unittest discover -s scripts/ci -p 'test_*.py' -v
    - name: Common evidence directory
      run: mkdir -p .ci/common-evidence
    - name: Preview policy and existing build guards
      run: npx vitest run scripts/ignoreVercelGitPreview.test.mjs scripts/guardVercelPreviewRewrites.test.mjs scripts/verifyVercelProductionBuild.test.mjs
        --maxWorkers=2 --reporter=default --reporter=json --outputFile=.ci/common-evidence/guards.json
    - name: TypeScript
      run: npm run typecheck
    - name: Catalog import focused regression
      run: npx vitest run src/utils/catalogImportError.test.ts src/components/catalog/ImportWizard.error.test.tsx --maxWorkers=2
        --reporter=default --reporter=json --outputFile=.ci/common-evidence/catalog.json
    - name: One complete frontend regression
      shell: bash
      run: |-
        set -o pipefail
        npm test -- --maxWorkers=2 --reporter=default --reporter=json --outputFile=.ci/common-evidence/vitest.json 2>&1 | tee .ci/common-evidence/vitest.log
    - name: One production build with existing rewrite guard
      run: npm run build
    - name: Bind build and test evidence to this PR merge
      id: package
      run: python3 scripts/ci/verified_build.py package
    - name: Immutable verified build
      id: bundle
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: verified-frontend-${{ github.run_id }}-${{ github.run_attempt }}
        path: .ci/shared-payload/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
    - name: Common regression diagnostics
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: frontend-common-evidence
        path: .ci/common-evidence/
        include-hidden-files: true
        if-no-files-found: ignore
        retention-days: 7
  catalog_import_ux:
    name: Catalog import UX and safe errors
    needs: verify_once
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMMON_RESULT: ${{ needs.verify_once.result }}
      SHARED_ARTIFACT_ID: ${{ needs.verify_once.outputs.artifact_id }}
      DOWNLOADED_ARTIFACT_ID: ${{ needs.verify_once.outputs.artifact_id }}
      SHARED_ARTIFACT_DIGEST: ${{ needs.verify_once.outputs.artifact_digest }}
      SHARED_MANIFEST_SHA256: ${{ needs.verify_once.outputs.manifest_sha256 }}
    steps:
    - name: Require successful common verification
      shell: bash
      run: |-
        if [[ "$COMMON_RESULT" != success ]]; then
          echo "::error::Shared verification is $COMMON_RESULT; acceptance did not execute."
          exit 1
        fi
        [[ "$SHARED_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
        [[ "$SHARED_ARTIFACT_DIGEST" =~ ^[a-f0-9]{64}$ ]]
        [[ "$SHARED_MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]]
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - name: Download this run artifact by immutable ID
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        artifact-ids: ${{ needs.verify_once.outputs.artifact_id }}
        path: .ci/download/
        skip-decompress: true
        digest-mismatch: error
    - name: Verify ZIP digest, merge, attempt, lock and all files before use
      run: python3 scripts/ci/verified_build.py verify
    - name: Catalog focus executed once in shared verification
      run: python3 -c "import json; r=json.load(open('.ci/verified/evidence/catalog.json')); print('Shared catalog regression:',
        r['numPassedTests'], 'tests; build provenance verified')"
